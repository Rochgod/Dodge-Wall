<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dodge Wall</title>
  <style>
    :root {
      --bg: #090b12;
      --bg-soft: #111523;
      --text: #f1f5ff;
      --muted: #91a0c5;
      --accent: #57d3ff;
      --danger: #ff4f6d;
      --good: #8cffb0;
      --shadow: 0 18px 42px rgba(0,0,0,.5);
      --radius: 18px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 30% 10%, #17213a 0%, var(--bg) 45%, #06070d 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      touch-action: none;
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
    }

    .frame {
      width: min(92vw, 480px);
      height: min(86vh, 820px);
      border-radius: calc(var(--radius) + 10px);
      background: linear-gradient(160deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      backdrop-filter: blur(6px);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(180deg, #0f1322 0%, #090b12 100%);
    }

    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-variant-numeric: tabular-nums;
    }

    .chip {
      background: rgba(5, 8, 17, .55);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      padding: .5rem .85rem;
      box-shadow: 0 8px 16px rgba(0,0,0,.25);
      transition: transform .25s ease, opacity .25s ease;
    }

    .chip span { display: block; line-height: 1.1; }
    .chip .label { font-size: .7rem; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
    .chip .value { font-size: 1.1rem; font-weight: 700; margin-top: .12rem; }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
      transition: opacity .35s ease, transform .35s ease;
      background: linear-gradient(180deg, rgba(3, 4, 8, .38), rgba(3, 4, 8, .65));
    }

    .overlay.hidden {
      opacity: 0;
      transform: scale(.98);
      pointer-events: none;
    }

    .card {
      width: min(100%, 360px);
      border-radius: var(--radius);
      background: rgba(10, 14, 26, .86);
      border: 1px solid rgba(255,255,255,.1);
      padding: 1.3rem 1.1rem;
      text-align: center;
      box-shadow: var(--shadow);
    }

    h1, h2 { margin: 0; font-weight: 800; letter-spacing: .03em; }
    h1 { font-size: clamp(1.7rem, 3vw + 1rem, 2.4rem); }
    h2 { font-size: clamp(1.4rem, 2vw + 1rem, 2rem); }

    .subtitle { margin: .65rem 0 1rem; color: var(--muted); font-size: .95rem; line-height: 1.45; }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin: .75rem 0 1rem; }

    .stat {
      background: rgba(255,255,255,.04);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.07);
      padding: .65rem;
    }

    .stat .k { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }
    .stat .v { margin-top: .2rem; font-size: 1.15rem; font-weight: 700; }

    .btn {
      pointer-events: auto;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: .85rem 1rem;
      font-size: 1rem;
      font-weight: 700;
      color: #031018;
      background: linear-gradient(135deg, var(--accent), #85ebff);
      box-shadow: 0 10px 24px rgba(87, 211, 255, .35);
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }

    .btn:active { transform: scale(.985); }

    .controls {
      margin-top: .8rem;
      display: flex;
      justify-content: center;
      gap: .5rem;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: .8rem;
    }

    .pill {
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      padding: .28rem .58rem;
      background: rgba(255,255,255,.03);
    }

    @media (max-width: 430px) {
      .frame {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        border: none;
      }
      #app { padding: 0; }
    }
  </style>
</head>
<body>
<div id="app">
  <div class="frame">
    <canvas id="game"></canvas>

    <div class="hud">
      <div class="chip"><span class="label">Score</span><span class="value" id="score">0.0</span></div>
      <div class="chip"><span class="label">High</span><span class="value" id="highScore">0.0</span></div>
    </div>

    <div class="overlay" id="startOverlay">
      <div class="card">
        <h1>Dodge Wall</h1>
        <p class="subtitle">Slide or arrow your square left/right. Survive as long as possible. Walls get faster. Stay alive.</p>
        <button class="btn" id="startBtn">Start Game</button>
        <div class="controls">
          <span class="pill">⬅️ ➡️ Arrow Keys</span>
          <span class="pill">👆 Swipe Left/Right</span>
        </div>
      </div>
    </div>

    <div class="overlay hidden" id="gameOverOverlay">
      <div class="card">
        <h2>Game Over</h2>
        <p class="subtitle">You hit a wall. One more run?</p>
        <div class="stats">
          <div class="stat"><div class="k">Score</div><div class="v" id="finalScore">0.0</div></div>
          <div class="stat"><div class="k">Best</div><div class="v" id="finalHigh">0.0</div></div>
        </div>
        <button class="btn" id="restartBtn">Restart</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const finalScoreEl = document.getElementById('finalScore');
  const finalHighEl = document.getElementById('finalHigh');

  const startOverlay = document.getElementById('startOverlay');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');

  const STORAGE_KEY = 'dodge-wall-high-score-v1';
  let highScore = parseFloat(localStorage.getItem(STORAGE_KEY)) || 0;
  highScoreEl.textContent = highScore.toFixed(1);

  const state = {
    running: false,
    over: false,
    score: 0,
    lastTs: 0,
    elapsed: 0,
    walls: [],
    particles: [],
    moveDir: 0,
    swipeActive: false,
    swipeStartX: 0,
    spawnTimer: 0,
    spawnGap: 0.95,
    wallSpeed: 180,
    difficultyTimer: 0,
    player: {
      x: 0,
      y: 0,
      size: 28,
      speed: 390,
      targetX: 0
    }
  };

  function fitCanvas() {
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.floor(rect.width * dpr);
    canvas.height = Math.floor(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!state.running) resetPlayer();
  }

  function resetPlayer() {
    state.player.x = canvas.clientWidth / 2 - state.player.size / 2;
    state.player.targetX = state.player.x;
    state.player.y = canvas.clientHeight - state.player.size - 20;
  }

  function resetGame() {
    state.score = 0;
    state.elapsed = 0;
    state.lastTs = 0;
    state.over = false;
    state.walls.length = 0;
    state.particles.length = 0;
    state.spawnTimer = 0;
    state.spawnGap = 0.95;
    state.wallSpeed = 180;
    state.difficultyTimer = 0;
    state.moveDir = 0;
    resetPlayer();
    scoreEl.textContent = '0.0';
  }

  function startGame() {
    primeAudio();
    resetGame();
    state.running = true;
    startOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    blip(440, 0.03, 'triangle', 0.03);
    requestAnimationFrame(loop);
  }

  function endGame() {
    state.running = false;
    state.over = true;
    burst(state.player.x + state.player.size / 2, state.player.y + state.player.size / 2);
    thud();
    if (state.score > highScore) {
      highScore = state.score;
      localStorage.setItem(STORAGE_KEY, highScore.toFixed(1));
      chirp();
    }
    highScoreEl.textContent = highScore.toFixed(1);
    finalScoreEl.textContent = state.score.toFixed(1);
    finalHighEl.textContent = highScore.toFixed(1);
    gameOverOverlay.classList.remove('hidden');
  }

  function spawnWall() {
    const minW = 44;
    const maxW = Math.max(70, canvas.clientWidth * 0.33);
    const width = minW + Math.random() * (maxW - minW);
    const x = Math.random() * (canvas.clientWidth - width);
    const height = 18 + Math.random() * 16;
    state.walls.push({ x, y: -height - 10, width, height });
  }

  function update(dt) {
    state.elapsed += dt;
    state.score = state.elapsed;
    scoreEl.textContent = state.score.toFixed(1);

    state.difficultyTimer += dt;
    if (state.difficultyTimer >= 1.0) {
      state.difficultyTimer = 0;
      state.wallSpeed = Math.min(560, state.wallSpeed + 9);
      state.spawnGap = Math.max(0.26, state.spawnGap - 0.018);
    }

    state.spawnTimer += dt;
    if (state.spawnTimer >= state.spawnGap) {
      state.spawnTimer = 0;
      spawnWall();
      if (Math.random() < 0.12 + Math.min(0.28, state.elapsed * 0.01)) spawnWall();
      tick();
    }

    const p = state.player;
    if (!state.swipeActive) p.targetX += state.moveDir * p.speed * dt;
    const pull = Math.min(1, dt * 18);
    p.x += (p.targetX - p.x) * pull;
    p.targetX = clamp(p.targetX, 0, canvas.clientWidth - p.size);
    p.x = clamp(p.x, 0, canvas.clientWidth - p.size);

    for (let i = state.walls.length - 1; i >= 0; i--) {
      const w = state.walls[i];
      w.y += state.wallSpeed * dt;
      if (w.y > canvas.clientHeight + 40) state.walls.splice(i, 1);
      else if (intersects(w, p)) {
        endGame();
        return;
      }
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pa = state.particles[i];
      pa.life -= dt;
      pa.x += pa.vx * dt;
      pa.y += pa.vy * dt;
      pa.vx *= 0.99;
      pa.vy = pa.vy * 0.99 + 180 * dt;
      if (pa.life <= 0) state.particles.splice(i, 1);
    }
  }

  function drawBackground(t) {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;

    ctx.clearRect(0, 0, w, h);
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#131a30');
    g.addColorStop(1, '#090b12');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.strokeStyle = 'rgba(120,160,255,.08)';
    ctx.lineWidth = 1;
    const spacing = 34;
    const drift = (t * 24) % spacing;
    for (let y = -spacing; y < h + spacing; y += spacing) {
      ctx.beginPath();
      ctx.moveTo(0, y + drift);
      ctx.lineTo(w, y + drift + 10);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlayer() {
    const p = state.player;
    ctx.save();
    ctx.shadowBlur = 18;
    ctx.shadowColor = 'rgba(87,211,255,.75)';
    ctx.fillStyle = '#6ce2ff';
    roundRect(ctx, p.x, p.y, p.size, p.size, 7);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    roundRect(ctx, p.x + 6, p.y + 6, p.size - 12, p.size - 12, 4);
    ctx.fill();
    ctx.restore();
  }

  function drawWalls() {
    for (const w of state.walls) {
      ctx.save();
      ctx.fillStyle = '#ff5e7a';
      ctx.shadowColor = 'rgba(255,79,109,.45)';
      ctx.shadowBlur = 12;
      roundRect(ctx, w.x, w.y, w.width, w.height, 6);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const pa of state.particles) {
      const alpha = Math.max(0, pa.life / pa.maxLife);
      ctx.fillStyle = `rgba(255, 130, 150, ${alpha})`;
      ctx.beginPath();
      ctx.arc(pa.x, pa.y, pa.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function loop(ts) {
    if (!state.running && state.particles.length === 0) return;

    if (!state.lastTs) state.lastTs = ts;
    let dt = (ts - state.lastTs) / 1000;
    state.lastTs = ts;
    dt = Math.min(dt, 0.034);

    drawBackground(ts / 1000);
    if (state.running) update(dt);
    drawWalls();
    drawPlayer();
    drawParticles();

    requestAnimationFrame(loop);
  }

  function intersects(a, p) {
    return p.x < a.x + a.width && p.x + p.size > a.x && p.y < a.y + a.height && p.y + p.size > a.y;
  }

  function clamp(v, min, max) {
    return v < min ? min : v > max ? max : v;
  }

  function roundRect(context, x, y, w, h, r) {
    context.beginPath();
    context.moveTo(x + r, y);
    context.arcTo(x + w, y, x + w, y + h, r);
    context.arcTo(x + w, y + h, x, y + h, r);
    context.arcTo(x, y + h, x, y, r);
    context.arcTo(x, y, x + w, y, r);
    context.closePath();
  }

  function burst(x, y) {
    const count = 30;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 50 + Math.random() * 280;
      state.particles.push({
        x,
        y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed - 40,
        life: 0.45 + Math.random() * 0.55,
        maxLife: 0.95,
        r: 1.5 + Math.random() * 2.8
      });
    }
    requestAnimationFrame(loop);
  }

  // --- Audio ---
  let audioCtx = null;
  let master = null;

  function primeAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    master = audioCtx.createGain();
    master.gain.value = 0.06;
    master.connect(audioCtx.destination);
  }

  function blip(freq, duration = 0.04, type = 'sine', gain = 0.02) {
    if (!audioCtx || audioCtx.state === 'suspended') audioCtx?.resume();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(gain, now + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    osc.connect(g);
    g.connect(master);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }

  function tick() {
    blip(180 + Math.random() * 20, 0.03, 'square', 0.012);
  }

  function thud() {
    if (!audioCtx || audioCtx.state === 'suspended') audioCtx?.resume();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(170, now);
    osc.frequency.exponentialRampToValueAtTime(42, now + 0.2);

    g.gain.setValueAtTime(0.001, now);
    g.gain.exponentialRampToValueAtTime(0.06, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);

    osc.connect(g);
    g.connect(master);
    osc.start(now);
    osc.stop(now + 0.26);
  }

  function chirp() {
    blip(620, 0.08, 'triangle', 0.03);
    setTimeout(() => blip(920, 0.08, 'triangle', 0.03), 60);
  }

  // --- Controls ---
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') state.moveDir = -1;
    else if (e.key === 'ArrowRight') state.moveDir = 1;
  });

  window.addEventListener('keyup', (e) => {
    if ((e.key === 'ArrowLeft' && state.moveDir === -1) || (e.key === 'ArrowRight' && state.moveDir === 1)) {
      state.moveDir = 0;
    }
  });

  canvas.addEventListener('touchstart', (e) => {
    if (!e.touches[0]) return;
    state.swipeActive = true;
    state.swipeStartX = e.touches[0].clientX;
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    if (!state.swipeActive || !e.touches[0]) return;
    const x = e.touches[0].clientX;
    const dx = x - state.swipeStartX;
    state.swipeStartX = x;
    state.player.targetX += dx;
  }, { passive: true });

  canvas.addEventListener('touchend', () => {
    state.swipeActive = false;
  }, { passive: true });

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);
  window.addEventListener('resize', fitCanvas);

  fitCanvas();
  drawBackground(0);
  drawPlayer();
})();
</script>
</body>
</html>
